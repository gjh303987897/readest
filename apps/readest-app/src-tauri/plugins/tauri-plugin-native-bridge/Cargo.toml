[package]
name = "tauri-plugin-native-bridge"
version = "0.1.0"
authors = [ "You" ]
description = "a bridge between tauri app and native OS functionality"
edition = "2021"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
links = "tauri-plugin-native-bridge"

[dependencies]
tauri = { version = "2" }
serde = "1.0"
thiserror = "2"
schemars = "0.8"

[dev-dependencies]
serde_json = "1"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
schemars = "0.8"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
font-enumeration = "0.9.0"

[target.'cfg(target_os = "macos")'.dependencies]
# WKWebView snapshot for the mesh page-curl texture (#555) — same
# dynamic-ObjC stack the main app's `src/macos/` modules use.
objc = "0.2.7"
cocoa = "0.25"
block = "0.1.6"

[target.'cfg(any(target_os = "ios", target_os = "android"))'.dependencies]
# The Swift/Kotlin plugin boundary is JSON-only, so webview snapshots
# arrive base64-encoded and are decoded back to bytes in mobile.rs.
base64 = "0.22"
