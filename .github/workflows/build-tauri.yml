name: Build Tauri artifacts

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-tauri-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows ${{ matrix.arch }} NSIS
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: arm64
            target: aarch64-pc-windows-msvc

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Prepare bundled web assets
        run: pnpm --filter @readest/readest-app setup-vendors

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: apps/readest-app/src-tauri -> target
          key: windows-${{ matrix.arch }}

      - name: Cache Tauri Windows tools
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/AppData/Local/tauri
          key: tauri-windows-tools-nsis-3.11-v1

      - name: Build Windows application
        working-directory: apps/readest-app
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: pnpm tauri build --target ${{ matrix.target }} --no-bundle

      - name: Bundle NSIS installer
        working-directory: apps/readest-app
        shell: pwsh
        run: |
          $maxAttempts = 3
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            pnpm tauri bundle --target ${{ matrix.target }} --bundles nsis
            if ($LASTEXITCODE -eq 0) {
              exit 0
            }

            if ($attempt -eq $maxAttempts) {
              exit $LASTEXITCODE
            }

            $delaySeconds = 15 * $attempt
            Write-Warning "NSIS bundling attempt $attempt failed; retrying in $delaySeconds seconds."
            Start-Sleep -Seconds $delaySeconds
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: readest-windows-${{ matrix.arch }}-${{ github.sha }}
          path: apps/readest-app/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux ${{ matrix.arch }} AppImage and Flatpak
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04
            flatpak_arch: x86_64
          - arch: arm64
            runner: ubuntu-22.04-arm
            flatpak_arch: aarch64

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak libappindicator3-dev libfontconfig-dev libfuse2 libgtk-3-dev librsvg2-dev libwebkit2gtk-4.1-dev patchelf pkg-config xdg-utils

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Prepare bundled web assets
        run: pnpm --filter @readest/readest-app setup-vendors

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: apps/readest-app/src-tauri -> target
          key: linux-${{ matrix.arch }}

      - name: Build AppImage
        working-directory: apps/readest-app
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: pnpm tauri build --bundles appimage

      - name: Build Flatpak bundle
        shell: bash
        run: |
          appimage="$(find apps/readest-app/src-tauri/target/release/bundle/appimage -type f -name '*.AppImage' -print -quit)"
          test -n "$appimage"
          bash .github/scripts/package-flatpak.sh \
            "$appimage" \
            "${{ matrix.flatpak_arch }}" \
            "apps/readest-app/src-tauri/target/release/bundle/flatpak/Readest_${{ matrix.arch }}.flatpak"

      - name: Upload Linux packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: readest-linux-${{ matrix.arch }}-${{ github.sha }}
          path: |
            apps/readest-app/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/readest-app/src-tauri/target/release/bundle/flatpak/*.flatpak
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS ${{ matrix.arch }} DMG
    runs-on: macos-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-apple-darwin
          - arch: arm64
            target: aarch64-apple-darwin

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Prepare bundled web assets
        run: pnpm --filter @readest/readest-app setup-vendors

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: apps/readest-app/src-tauri -> target
          key: macos-${{ matrix.arch }}

      - name: Build ad-hoc signed DMG
        working-directory: apps/readest-app
        env:
          APPLE_SIGNING_IDENTITY: '-'
          NODE_OPTIONS: --max-old-space-size=8192
        run: pnpm tauri build --target ${{ matrix.target }} --bundles dmg

      - name: Upload macOS installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: readest-macos-${{ matrix.arch }}-${{ github.sha }}
          path: apps/readest-app/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android ${{ matrix.abi }} release APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            target: aarch64
            rust_target: aarch64-linux-android
          - abi: armeabi-v7a
            target: armv7
            rust_target: armv7-linux-androideabi
          - abi: x86
            target: i686
            rust_target: i686-linux-android
          - abi: x86_64
            target: x86_64
            rust_target: x86_64-linux-android

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: zulu
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Install Android NDK
        run: sdkmanager "ndk;28.2.13676358"

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Prepare bundled web assets
        run: pnpm --filter @readest/readest-app setup-vendors

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: apps/readest-app/src-tauri -> target
          key: android-release-${{ matrix.target }}

      - name: Build optimized release APK
        working-directory: apps/readest-app
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
          CARGO_PROFILE_RELEASE_DEBUG: "0"
          CARGO_PROFILE_RELEASE_LTO: thin
          CARGO_PROFILE_RELEASE_STRIP: symbols
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          rm -rf src-tauri/gen/android
          pnpm tauri android init --ci
          pnpm build
          find out -type f -name '*.map' -delete
          pnpm tauri android build --target "${{ matrix.target }}" --apk --ci --config '{"build":{"beforeBuildCommand":""}}'

      - name: Sign and verify Android APK
        working-directory: apps/readest-app
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"

          keystore="$RUNNER_TEMP/readest-android-release.jks"
          keystore_password_file="$RUNNER_TEMP/readest-android-keystore-password"
          key_password_file="$RUNNER_TEMP/readest-android-key-password"
          trap 'rm -f "$keystore" "$keystore_password_file" "$key_password_file"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          printf '%s' "$ANDROID_KEY_PASSWORD" > "$keystore_password_file"
          printf '%s' "$ANDROID_KEY_PASSWORD" > "$key_password_file"
          chmod 600 "$keystore"
          chmod 600 "$keystore_password_file" "$key_password_file"
          unset ANDROID_KEYSTORE_BASE64 ANDROID_KEY_PASSWORD

          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          zipalign="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign -print | sort -V | tail -n 1)"
          test -n "$apksigner"
          test -n "$zipalign"

          mapfile -d '' unsigned_apks < <(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*-unsigned.apk' -print0)
          test "${#unsigned_apks[@]}" -gt 0
          for unsigned_apk in "${unsigned_apks[@]}"; do
            aligned_apk="${unsigned_apk%.apk}-aligned.apk"
            signed_apk="${unsigned_apk%-unsigned.apk}.apk"
            "$zipalign" -f -p 4 "$unsigned_apk" "$aligned_apk"
            "$apksigner" sign \
              --ks "$keystore" \
              --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --ks-pass "file:$keystore_password_file" \
              --key-pass "file:$key_password_file" \
              --out "$signed_apk" \
              "$aligned_apk"
            "$apksigner" verify --verbose --print-certs "$signed_apk"
            "$apksigner" verify --print-certs "$signed_apk" | grep -qi \
              'Signer #1 certificate SHA-256 digest: b170604e596e8cf66cfeb985cdfaa14796b1bd5dcf35037bdafba87ad57db200'
            rm -f "$unsigned_apk" "$aligned_apk"
          done

      - name: Upload Android release APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: readest-android-${{ matrix.abi }}-release-${{ github.sha }}
          path: apps/readest-app/src-tauri/gen/android/app/build/outputs/apk/**/*-release.apk
          if-no-files-found: error
          retention-days: 14

  ios-simulator:
    name: iOS ARM64 simulator app
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Prepare bundled web assets
        run: pnpm --filter @readest/readest-app setup-vendors

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: aarch64-apple-ios-sim

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: apps/readest-app/src-tauri -> target
          key: ios-simulator-arm64

      - name: Build unsigned iOS simulator app
        working-directory: apps/readest-app
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          rm -rf src-tauri/gen/apple
          pnpm tauri ios init --ci
          pnpm tauri ios build --debug --target aarch64-sim --ci --no-sign

      - name: Archive iOS simulator app
        working-directory: apps/readest-app
        run: |
          app_path="$(find src-tauri/gen/apple/build -type d -name '*.app' -print -quit)"
          test -n "$app_path"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" Readest-iOS-simulator-arm64.zip

      - name: Upload iOS simulator app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: readest-ios-simulator-arm64-${{ github.sha }}
          path: apps/readest-app/Readest-iOS-simulator-arm64.zip
          if-no-files-found: error
          retention-days: 14
